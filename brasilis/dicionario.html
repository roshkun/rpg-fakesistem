<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1424">
<title>Dicionário de Partículas — Etmos RPG</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%27M16 2 28 16 16 30 4 16z%27 fill=%27%233e1c43%27/%3E%3C/svg%3E">
<style>
  :root{ --ink:#3e1c43; --paper:#e4e2f1; --paper2:#f1effa; --line:#c9c2dc; --deep:#1d1424; --acc:#6e3a7d; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; }
  body{ background:var(--deep); color:#f1ecf7; font-family:Georgia,"Times New Roman",serif; min-height:100vh; padding-bottom:calc(env(safe-area-inset-bottom) + 24px); }
  @keyframes veilout{ from{opacity:1} to{opacity:0} }
  body::before{ content:""; position:fixed; inset:0; background:var(--deep); z-index:100; pointer-events:none; animation:veilout .5s ease-out both; }

  header{ position:sticky; top:0; z-index:20; background:rgba(29,20,36,.96); backdrop-filter:blur(8px); border-bottom:1px solid #4a2e55; padding:10px 12px 10px; }
  .top{ display:flex; align-items:center; gap:10px; }
  .top h1{ flex:1; margin:0; font-size:17px; min-width:0; letter-spacing:.04em; }
  .top a{ font:600 13px/1 system-ui,sans-serif; color:#f1ecf7; text-decoration:none; background:transparent; border:1px solid #7b4a8a; padding:9px 12px; border-radius:8px; white-space:nowrap; }
  .top a:hover{ background:#3a2350; }
  .search{ margin-top:10px; position:relative; }
  .search input{ width:100%; font:16px system-ui,sans-serif; color:#f1ecf7; background:#2a1a36; border:1px solid #5b3a6b; border-radius:10px; padding:12px 14px 12px 40px; outline:none; }
  .search input:focus{ border-color:#a77ac0; box-shadow:0 0 0 2px rgba(167,122,192,.35); }
  .search svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.7; }
  .chips{ display:flex; gap:8px; overflow-x:auto; padding:10px 0 2px; scrollbar-width:none; }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{ flex:none; font:600 13px/1 system-ui,sans-serif; color:#d9cbe6; background:#2a1a36; border:1px solid #5b3a6b; padding:9px 13px; border-radius:99px; cursor:pointer; }
  .chip[aria-pressed="true"]{ background:var(--acc); color:#fff; border-color:#a77ac0; }
  .info{ font:13px system-ui,sans-serif; color:#b9a9c6; padding:12px 14px 4px; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .howto{ margin:12px; padding:12px 14px; border:1px solid #4a2e55; border-radius:12px; background:#26172f; font:14px/1.5 system-ui,sans-serif; color:#d9cbe6; }
  .howto b{ color:#fff; }

  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:10px 12px; max-width:1100px; margin:0 auto; }
  @media (min-width:560px){ .grid{ grid-template-columns:repeat(4,1fr); } }
  @media (min-width:820px){ .grid{ grid-template-columns:repeat(4,1fr); } } @media (min-width:1100px){ .grid{ grid-template-columns:repeat(5,1fr); } }
  .card{ position:relative; background:var(--paper); color:var(--ink); border:0; border-radius:12px; padding:8px 6px 10px; text-align:center; cursor:pointer; font-family:inherit;
         box-shadow:0 2px 0 rgba(0,0,0,.25); transition:transform .12s; }
  .card:active{ transform:scale(.97); }
  .card:hover{ background:var(--paper2); }
  .card svg{ display:block; width:100%; height:auto; aspect-ratio:41/40; }
  .card svg path{ fill:var(--ink); fill-rule:evenodd; }
  .card .cat{ font:600 9px/1 system-ui,sans-serif; letter-spacing:.06em; text-transform:uppercase; opacity:.65; margin-top:2px; }
  .card .nome{ font-weight:bold; font-size:13px; line-height:1.15; margin-top:4px; min-height:2.3em; display:flex; align-items:center; justify-content:center; overflow-wrap:anywhere; word-break:break-word; }
  .card .cod{ font:700 12px/1 Georgia,serif; letter-spacing:.14em; margin-top:4px; color:var(--acc); }
  .card .tag{ position:absolute; top:6px; right:6px; width:18px; height:18px; border-radius:50%; background:var(--ink); color:#fff; font:700 11px/18px system-ui,sans-serif; display:none; }
  .card.mine .tag{ display:block; }
  .card .niv{ position:absolute; top:6px; left:6px; font:700 10px/1 system-ui,sans-serif; background:#cdbfe8; color:var(--ink); border-radius:6px; padding:3px 5px; }
  .empty{ grid-column:1/-1; text-align:center; padding:40px 10px; color:#b9a9c6; font:15px system-ui,sans-serif; }

  /* detalhe */
  dialog{ border:0; padding:0; background:transparent; max-width:none; max-height:none; width:100%; height:100%; }
  dialog::backdrop{ background:rgba(10,5,15,.7); backdrop-filter:blur(3px); }
  .sheet{ position:fixed; left:0; right:0; bottom:0; background:var(--paper); color:var(--ink); border-radius:22px 22px 0 0; padding:18px 18px calc(env(safe-area-inset-bottom) + 18px); max-width:520px; margin:0 auto; animation:up .25s ease-out; }
  @keyframes up{ from{ transform:translateY(40px); opacity:0 } to{ transform:none; opacity:1 } }
  .sheet .big{ width:min(62vw,260px); margin:0 auto; display:block; }
  .sheet .big path{ fill:var(--ink); fill-rule:evenodd; }
  .sheet h2{ text-align:center; margin:6px 0 2px; font-size:22px; }
  .sheet .sub{ text-align:center; font:600 13px system-ui,sans-serif; opacity:.75; }
  .sheet .cod{ text-align:center; font:700 22px Georgia,serif; letter-spacing:.2em; color:var(--acc); margin:6px 0 10px; }
  .sheet .mine{ text-align:center; font:600 13px system-ui,sans-serif; color:#fff; background:var(--ink); border-radius:99px; padding:7px 12px; width:max-content; margin:0 auto 10px; }
  .sheet .desc{ font:15px/1.5 Georgia,serif; margin:0 0 10px; text-align:center; }
  .sheet .ex{ background:rgba(62,28,67,.09); border-radius:10px; padding:9px 12px; margin:0 0 12px; font:13.5px/1.45 system-ui,sans-serif; }
  .sheet .ex b{ font-family:Georgia,serif; color:var(--acc); }
  .sheet{ max-height:92vh; overflow-y:auto; }
  details.gl{ margin:0 12px 12px; border:1px solid #4a2e55; border-radius:12px; background:#26172f; color:#d9cbe6; font:14px/1.5 system-ui,sans-serif; }
  details.gl summary{ cursor:pointer; padding:12px 14px; font-weight:700; color:#fff; }
  details.gl .in{ padding:0 14px 12px; } details.gl dt{ font-weight:700; color:#fff; margin-top:8px; } details.gl dd{ margin:0; }
  .btns{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .btns button{ font:600 14px system-ui,sans-serif; border-radius:10px; padding:11px 14px; border:1px solid var(--ink); background:transparent; color:var(--ink); cursor:pointer; }
  .btns button.pri{ background:var(--ink); color:#fff; }
  .nav{ position:absolute; top:50%; transform:translateY(-50%); background:rgba(62,28,67,.1); border:0; width:40px; height:40px; border-radius:50%; font-size:20px; color:var(--ink); cursor:pointer; }
  .nav.l{ left:8px; } .nav.r{ right:8px; }
  .toast{ position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 20px); transform:translateX(-50%); background:#2a1536; color:#f4ecfa; font:600 13px system-ui,sans-serif; padding:10px 16px; border-radius:99px; border:1px solid #7b4a8a; opacity:0; pointer-events:none; transition:opacity .2s; z-index:200; }
  .toast.on{ opacity:1; }

  /* melhorias */
  .sheet{ max-height:92vh; overflow-y:auto; }
  .sheet .big{ width:auto; height:min(30vh,230px); max-width:70%; }
  @media (min-width:760px){
    dialog{ display:flex; align-items:center; justify-content:center; }
    .sheet{ position:relative; left:auto; right:auto; bottom:auto; width:min(860px,92vw); max-width:none; margin:0; border-radius:20px; display:grid; grid-template-columns:260px 1fr; column-gap:28px; align-items:center; padding:28px 36px; max-height:88vh; }
    .sheet .big{ grid-column:1; grid-row:1/8; height:auto; width:100%; max-width:none; }
    .sheet > :not(.big):not(.nav){ grid-column:2; }
    .sheet h2,.sheet .sub,.sheet .cod,.sheet .desc,.sheet .mine{ text-align:left; margin-left:0; }
    .sheet .btns{ justify-content:flex-start; }
    .card .dsc{ display:block; }
  }
  .card .dsc{ display:none; font:11px/1.3 system-ui,sans-serif; opacity:.75; margin-top:5px; text-align:left; }
  .top .logo{ height:26px; filter:brightness(0) invert(.92); margin-right:2px; }
  .btns button.add{ background:var(--acc); color:#fff; border-color:var(--acc); }
  .tray{ position:fixed; left:0; right:0; bottom:0; z-index:40; background:rgba(29,20,36,.97); border-top:2px solid #7b4a8a; padding:10px 12px calc(env(safe-area-inset-bottom) + 10px); display:none; }
  .tray.on{ display:block; }
  .tray .row{ display:flex; gap:8px; align-items:center; max-width:1100px; margin:0 auto; flex-wrap:wrap; }
  .tray .gl{ display:flex; gap:6px; flex:1; min-width:0; overflow-x:auto; }
  .tray .mini{ flex:none; width:44px; background:var(--paper); border-radius:8px; padding:3px; position:relative; }
  .tray .mini svg{ width:100%; height:auto; display:block; } .tray .mini path{ fill:var(--ink); fill-rule:evenodd; }
  .tray .mini b{ position:absolute; top:-6px; left:-4px; background:var(--acc); color:#fff; font:700 9px system-ui; border-radius:4px; padding:1px 3px; }
  .tray .txt{ font:700 20px Georgia,serif; letter-spacing:.04em; color:#fff; flex:1 1 100%; }
  .tray button{ font:600 13px system-ui,sans-serif; color:#f1ecf7; background:transparent; border:1px solid #7b4a8a; padding:9px 12px; border-radius:8px; cursor:pointer; }
  .tray button.pri{ background:#5a2d66; }
  body.hasTray{ padding-bottom:150px; } body.hasTray .toast{ bottom:calc(env(safe-area-inset-bottom) + 130px); }
</style>
</head>
<body>
<header>
  <div class="top">
    <img class="logo" src="assets/ui/logo-etmos.svg" alt=""><h1>Dicionário de Partículas</h1>
    <a id="conj" href="conjurar.html">✨ Montar magia</a><a id="modl" href="modulos.html">Módulos</a><a id="back" href="index.html">← Voltar</a>
  </div>
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f1ecf7" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Buscar nome ou código" autocomplete="off" aria-label="Buscar partícula">
  </label>
  <div class="chips" id="chips"></div>
</header>

<details class="gl"><summary>Glossário e como usar este dicionário</summary><div class="in" id="gl"></div></details>
<div class="howto"><b>Como ler:</b> uma magia combina <b>Função</b> (o que faz) + <b>Objeto</b> (em quê) + <b>Característica</b> (como) + <b>Complementos</b>. Toque em uma partícula para ver o glifo grande.</div>
<div class="info"><span id="count"></span><span id="mineinfo"></span></div>
<main class="grid" id="grid" aria-live="polite"></main>

<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>
<div class="tray" id="tray"><div class="row"><div class="txt" id="ftxt"></div><div class="gl" id="fgl"></div><button id="fcopy" class="pri">Copiar frase</button><button id="fclr">Limpar</button></div></div>
<div class="toast" id="toast"></div>

<script src="aviso.js?v=2"></script>
<script src="data/alunos.js?v=12"></script>
<script src="data/particulas.js?v=4"></script>
<script src="data/glossario.js?v=4"></script>
<script src="data/mesa.js?v=11"></script>
<script src="mesa-cliente.js?v=5"></script>
<script>
(function(){
  "use strict";
  var P=window.PARTICULAS||[], ALUNOS=window.ALUNOS||[];
  var VB='120 15 410 400';
  var qs=new URLSearchParams(location.search), aid=qs.get('aluno');
  var ALUNO=ALUNOS.filter(function(a){return a.id===aid;})[0]||null;
  var CATS=['Todas','Funções','Objetos','Características','Complementos'];
  var cat='Todas', q='', onlyMine=false;

  /* partículas do grimório do aluno (ficha base + alterações salvas no navegador) */
  var known={};
  if(ALUNO){
    var st={}; var base=ALUNO.ficha||{};
    Object.keys(base).forEach(function(k){ st[k]=base[k]; });
    try{ var s=JSON.parse(localStorage.getItem('etmos-ficha-v2-'+ALUNO.id)||'{}'); Object.keys(s).forEach(function(k){ st[k]=s[k]; }); }catch(e){}
    Object.keys(st).forEach(function(k){ if(st[k]===true) known[k]=true; });
    document.getElementById('back').href='ficha.html?aluno='+encodeURIComponent(ALUNO.id);
    document.getElementById('back').textContent='← Ficha'; document.getElementById('conj').href='conjurar.html?aluno='+encodeURIComponent(ALUNO.id); document.getElementById('modl').href='modulos.html?aluno='+encodeURIComponent(ALUNO.id);
  }
  P.forEach(function(p){ p.mine=!!(ALUNO&&((p.key&&known[p.key])||(p.cat==='Complementos'&&p.nivel===1))); var gd=((window.GLOSSARIO||{}).d||{})[p.codigo]; p._s=norm(p.nome+' '+p.codigo+' '+p.cat+' '+(gd?gd[0]:'')); });
  function norm(s){ return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
  function svg(d,cls){ return '<svg viewBox="'+VB+'" '+(cls?'class="'+cls+'" ':'')+'role="img" aria-hidden="true"><path d="'+d+'"/></svg>'; }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  /* chips */
  var chipsEl=document.getElementById('chips');
  var chipList=CATS.slice(); if(ALUNO) chipList.push('Meu grimório');
  chipList.forEach(function(c){
    var b=document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=c; b.dataset.c=c;
    b.setAttribute('aria-pressed',c==='Todas'?'true':'false');
    b.addEventListener('click',function(){
      if(c==='Meu grimório'){ onlyMine=!onlyMine; b.setAttribute('aria-pressed',onlyMine); }
      else{ cat=c; [].forEach.call(chipsEl.children,function(x){ if(x.dataset.c!=='Meu grimório') x.setAttribute('aria-pressed',x.dataset.c===cat); }); }
      render();
    });
    chipsEl.appendChild(b);
  });
  document.getElementById('q').addEventListener('input',function(e){ q=norm(e.target.value.trim()); render(); });

  function cardDsc(p){ var g=((window.GLOSSARIO||{}).d||{})[p.codigo]; if(!g) return ''; var t=g[0].split(/(?<=\.)\s/)[0]; if(t.length>90) t=t.slice(0,88).replace(/\s+\S*$/,'')+'…'; return '<div class="dsc">'+esc(t)+'</div>'; }
  var gridEl=document.getElementById('grid'), shown=[];
  function render(){
    shown=P.filter(function(p){
      if(cat!=='Todas' && p.cat!==cat) return false;
      if(onlyMine && !p.mine) return false;
      if(q && p._s.indexOf(q)<0) return false;
      return true;
    });
    gridEl.innerHTML='';
    if(!shown.length){ gridEl.innerHTML='<div class="empty">Nenhuma partícula encontrada.</div>'; }
    shown.forEach(function(p,i){
      var b=document.createElement('button'); b.type='button'; b.className='card'+(p.mine?' mine':'');
      b.setAttribute('aria-label',p.nome+' ('+p.codigo+')');
      b.innerHTML=svg(p.d)+'<div class="cat">'+esc(p.cat.replace(/s$/,''))+'</div><div class="nome">'+esc(p.nome)+'</div><div class="cod">'+esc(p.codigo)+'</div>'+(p.mine?'<span class="tag" title="No seu grimório">✓</span>':'')+(p.nivel?'<span class="niv">'+p.nivel+'º nível</span>':'');
      b.addEventListener('click',function(){ openDetail(i); });
      gridEl.appendChild(b);
    });
    document.getElementById('count').textContent=shown.length+' de '+P.length+' partículas';
    var m=P.filter(function(p){return p.mine;}).length;
    document.getElementById('mineinfo').textContent=ALUNO?('✓ = no grimório de '+(ALUNO.ficha&&ALUNO.ficha.personagem||ALUNO.nome)+' ('+m+')'):'';
  }
  render();

  /* detalhe */
  var dlg=document.getElementById('dlg'), sheet=document.getElementById('sheet'), cur=0;
  function descHtml(p){ var g=(window.GLOSSARIO||{}).d||{}, x=g[p.codigo]; if(!x) return ''; var h='<p class="desc">'+esc(x[0])+'</p>'; if(x[1]) h+='<div class="ex"><b>'+esc(x[1][0])+'</b> — '+esc(x[1][1])+' <i>('+esc(x[1][2])+')</i></div>'; return h; }
  (function(){ var G=window.GLOSSARIO; if(!G) return; var h='<p>'+esc(G.como)+'</p><dl>'; G.termos.forEach(function(t){ h+='<dt>'+esc(t[0])+'</dt><dd>'+esc(t[1])+'</dd>'; }); document.getElementById('gl').innerHTML=h+'</dl>'+(G.nota?'<p>'+esc(G.nota)+'</p>':''); })();
  function openDetail(i){
    cur=i; var p=shown[i];
    var sub=p.cat.replace(/s$/,'')+(p.nivel?' · '+p.nivel+'º nível':'');
    sheet.innerHTML='<button class="nav l" aria-label="Anterior">‹</button><button class="nav r" aria-label="Próxima">›</button>'
      +svg(p.d,'big')+'<h2>'+esc(p.nome)+'</h2><div class="sub">'+esc(sub)+'</div><div class="cod">'+esc(p.codigo)+'</div>'
      +(p.mine?'<div class="mine">✓ No seu grimório</div>':'')+descHtml(p)
      +'<div class="btns"><button class="add" id="addf">'+(inFrase(p)?'✓ Na frase (remover)':'＋ Na frase')+'</button><button id="cpy">Copiar código</button><button id="dl">Baixar SVG</button><button class="pri" id="cls">Fechar</button></div>';
    if(!dlg.open) dlg.showModal();
    sheet.querySelector('.l').onclick=function(e){ e.stopPropagation(); openDetail((cur-1+shown.length)%shown.length); };
    sheet.querySelector('.r').onclick=function(e){ e.stopPropagation(); openDetail((cur+1)%shown.length); };
    sheet.querySelector('#cls').onclick=function(){ dlg.close(); };
    sheet.querySelector('#cpy').onclick=function(){ copy(p.codigo); };
    sheet.querySelector('#addf').onclick=function(){ toggleFrase(p); openDetail(cur); };
    sheet.querySelector('#dl').onclick=function(){ download(p); };
  }
  dlg.addEventListener('click',function(e){ if(e.target===dlg) dlg.close(); });
  document.addEventListener('keydown',function(e){ if(!dlg.open) return; if(e.key==='ArrowLeft') sheet.querySelector('.l').click(); if(e.key==='ArrowRight') sheet.querySelector('.r').click(); });

  /* montador de frase */
  var F={fun:null,obj:null,car:[]};
  function cap(c){ c=String(c).toLowerCase(); return c.charAt(0).toUpperCase()+c.slice(1); }
  function inFrase(p){ return F.fun===p||F.obj===p||F.car.indexOf(p)>=0; }
  function toggleFrase(p){
    if(p.cat==='Funções') F.fun=(F.fun===p?null:p);
    else if(p.cat==='Objetos') F.obj=(F.obj===p?null:p);
    else{ var i=F.car.indexOf(p); if(i>=0) F.car.splice(i,1); else F.car.push(p); }
    drawTray(); toast(inFrase(p)?'Adicionada à frase':'Removida da frase');
  }
  function fraseTxt(){
    var w=[]; if(F.fun&&F.obj) w.push(cap(F.fun.codigo)+F.obj.codigo.toLowerCase()); else if(F.fun) w.push(cap(F.fun.codigo)); else if(F.obj) w.push(cap(F.obj.codigo));
    F.car.forEach(function(c){ w.push(cap(c.codigo)); }); return w.join(' ');
  }
  function drawTray(){
    var all=[F.fun,F.obj].concat(F.car).filter(Boolean), t=document.getElementById('tray');
    t.classList.toggle('on',all.length>0); document.body.classList.toggle('hasTray',all.length>0);
    document.getElementById('ftxt').textContent=fraseTxt();
    document.getElementById('fgl').innerHTML=all.map(function(p){ var k=p.cat==='Funções'?'F':p.cat==='Objetos'?'O':'C'; return '<span class="mini" title="'+esc(p.nome)+'"><b>'+k+'</b>'+svg(p.d)+'</span>'; }).join('');
  }
  document.getElementById('fcopy').onclick=function(){ copy(fraseTxt()); };
  document.getElementById('fclr').onclick=function(){ F={fun:null,obj:null,car:[]}; drawTray(); };
  var toastEl=document.getElementById('toast'), tt;
  function toast(m){ toastEl.textContent=m; toastEl.classList.add('on'); clearTimeout(tt); tt=setTimeout(function(){ toastEl.classList.remove('on'); },1600); }
  function copy(t){
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(function(){ toast('Código copiado'); },function(){ toast(t); }); }
    else toast(t);
  }
  function download(p){
    var x='<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+VB+'" width="410" height="400"><title>'+esc(p.nome)+' ('+p.codigo+')</title><path fill="#3e1c43" fill-rule="evenodd" d="'+p.d+'"/></svg>';
    var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([x],{type:'image/svg+xml'}));
    a.download=p.codigo.toLowerCase()+'_'+norm(p.nome).replace(/[^a-z0-9]+/g,'-')+'.svg';
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500);
  }
})();
</script>
</body>
</html>
