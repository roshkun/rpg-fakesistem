<style>
  :root{ --ink:#2e1a3a; --purple:#3e1c43; --paper:#e4e2f1; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  @keyframes veilout{ from{opacity:1} to{opacity:0} }
  body::before{ content:""; position:fixed; inset:0; background:#1d1424; z-index:100; pointer-events:none; animation:veilout .6s ease-out .05s both; }
  body{ background:#1d1424; font-family: Georgia, "Times New Roman", serif; color:var(--ink); padding-bottom:40px; }

  .bar{ position:sticky; top:0; z-index:20; display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:center;
        padding:10px 12px; background:rgba(29,20,36,.94); backdrop-filter:blur(6px); border-bottom:1px solid #4a2e55; }
  .bar button, .bar a.btn{ font:600 13px/1 system-ui, sans-serif; color:#f1ecf7; background:#5a2d66; border:1px solid #7b4a8a;
        padding:9px 12px; border-radius:8px; cursor:pointer; text-decoration:none; display:inline-block; }
  .bar button:hover, .bar a.btn:hover{ background:#6e3a7d; }
  .bar button.ghost, .bar a.btn.ghost{ background:transparent; }
  .bar .hint{ font:12px system-ui, sans-serif; color:#b9a9c6; }
  .bar button:disabled{ opacity:.6; cursor:wait; }

  .page{ position:relative; width:min(780px, calc(100vw - 16px)); aspect-ratio:1386/1969; margin:18px auto 0;
         container-type:inline-size; background:#fff; box-shadow:0 8px 30px rgba(0,0,0,.5); overflow:hidden; }
  .page > img.bg{ position:absolute; inset:0; width:100%; height:100%; display:block; user-select:none; -webkit-user-drag:none; pointer-events:none; }

  .f{ position:absolute; margin:0; border:0; background:transparent; color:var(--ink); font-family:inherit;
      outline:none; border-radius:6px; transition:background .12s, box-shadow .12s; }
  input.f, textarea.f{ width:auto; }
  input.f:hover, textarea.f:hover{ background:rgba(120,70,150,.07); }
  input.f:focus, textarea.f:focus{ background:rgba(120,70,150,.12); box-shadow:0 0 0 1.5px rgba(110,55,140,.55); }
  textarea.f{ resize:none; line-height:1.38; overflow:hidden; }
  textarea.f.scroll{ overflow-y:auto; }
  input.f.c{ text-align:center; }
  input.f.u{ border-radius:0; }

  canvas.foto{ position:absolute; pointer-events:none; }
  .pip{ cursor:pointer; border-radius:6px; }
  .pip:hover{ background:rgba(120,70,150,.12); }
  .pip::after{ content:""; position:absolute; inset:20%; border-radius:3px; background:var(--purple); transform:scale(0); transition:transform .1s; }
  .pip.on::after{ transform:scale(1); }

  .cb{ cursor:pointer; border-radius:4px; }
  .cb:hover{ background:rgba(120,70,150,.14); }
  .cb::after{ content:""; position:absolute; left:26%; top:4%; width:30%; height:62%; border:solid var(--purple); border-width:0 .55cqw .55cqw 0; transform:rotate(42deg) scale(0); transition:transform .1s; }
  .cb.on::after{ transform:rotate(42deg) scale(1); }

  @media (max-width:600px){ .bar{ gap:6px; padding:8px; } .bar .hint{ display:none; } }
  @page{ size:498.898pt 708.661pt; margin:0; }
  @media print{
    *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    body{ background:none; padding:0; }
    .bar{ display:none; }
    .page{ width:498.898pt; height:708.661pt; aspect-ratio:auto; margin:0; box-shadow:none; break-after:page; page-break-after:always; }
    .page:last-of-type{ break-after:auto; page-break-after:auto; }
    input.f:hover, textarea.f:hover, .pip:hover, .cb:hover{ background:transparent; }
    input.f:focus, textarea.f:focus{ box-shadow:none; background:transparent; }
  }
</style>

    photoCv.style.left=((PH.x-PH.m)/W*100)+'%'; photoCv.style.top=((PH.y-PH.m)/H*100)+'%';
    photoCv.style.width=((PH.w+2*PH.m)/W*100)+'%'; photoCv.style.height=((PH.h+2*PH.m)/H*100)+'%';
    paintPhotoDom();
    if(ALUNO.foto){ var im=new Image(); im.onload=function(){ photoImg=im; paintPhotoDom(); }; im.src=ALUNO.foto; }
  })();

  var refresh = [];  // funções que sincronizam DOM <- estado

  /* ---------- Construção do DOM ---------- */
  PAGES.forEach(function(pg){
    var root=document.getElementById(pg.id);
    pg.f.forEach(function(d){
      if(d.t==='t'||d.t==='a'){
        var el=document.createElement(d.t==='t'?'input':'textarea');
        if(d.t==='t') el.type='text';
        el.className='f'+(d.c?' c':'')+(d.u?' u':'')+(d.sc?' scroll':'');
        el.spellcheck=false; el.autocomplete='off';
        el.setAttribute('aria-label',d.k);
        place(el,d.x,d.y,d.w,d.h);
        el.style.fontSize=cq(d.fs);
        if(d.t==='a'){ el.style.padding=pct(d.pad*0.7,W)+' '+pct(d.pad,W); }
        else{ el.style.padding='0 '+pct(10,W); }
        el.addEventListener('input',function(){ state[d.k]=el.value; save(); });
        refresh.push(function(){ el.value=state[d.k]||''; });
        root.appendChild(el);
      } else if(d.t==='c'){
        var b=document.createElement('div');
        b.className='f cb'; b.setAttribute('role','checkbox'); b.tabIndex=0; b.setAttribute('aria-label',d.k);
        place(b,d.x,d.y,d.w,d.h);
        function tog(){ state[d.k]=!state[d.k]; sync(); save(); }
        function sync(){ b.classList.toggle('on',!!state[d.k]); b.setAttribute('aria-checked',!!state[d.k]); }
        b.addEventListener('click',tog);
        b.addEventListener('keydown',function(e){ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); tog(); }});
        refresh.push(sync);
        root.appendChild(b);
      } else if(d.t==='g'){
        var els=[];
        d.xs.forEach(function(x,i){
          var b=document.createElement('div');
          b.className='f pip'; b.setAttribute('role','checkbox'); b.tabIndex=0; b.setAttribute('aria-label',d.k+' '+(i+1));
          place(b,x,d.ys[i],d.w,d.h);
          function act(){ var lv=state[d.k]||0; state[d.k]=(lv===i+1)?i:i+1; sync(); save(); }
          b.addEventListener('click',act);
          b.addEventListener('keydown',function(e){ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); act(); }});
          els.push(b); root.appendChild(b);
        });
        function sync(){ var lv=state[d.k]||0; els.forEach(function(e,i){ e.classList.toggle('on',i<lv); }); }
        refresh.push(sync);
      }
    });
  });
  function refreshAll(){ refresh.forEach(function(f){ f(); }); }
  refreshAll();

  /* ---------- Restaurar / Exportar / Imprimir ---------- */
  document.getElementById('btnReset').addEventListener('click',function(){
    if(!confirm('Voltar aos dados originais deste aluno? As alterações feitas aqui serão perdidas.')) return;
    state={}; Object.keys(BASE).forEach(function(k){ state[k]=BASE[k]; }); save(); refreshAll();
  });
  document.getElementById('btnExport').addEventListener('click',function(){
    var out={}; Object.keys(state).forEach(function(k){ var v=state[k]; if(v!==''&&v!==false&&v!==0&&v!==undefined) out[k]=v; });
    var txt=JSON.stringify({id:ALUNO.id,nome:ALUNO.nome,ficha:out},null,2);
    var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'})); a.download='ficha-'+ALUNO.id+'.json';
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },2000);
  });
  document.getElementById('btnPrint').addEventListener('click',function(){ window.print(); });

  /* ---------- Geração de PDF (sem bibliotecas) ---------- */
  function loadImg(src){
    return new Promise(function(res,rej){ var i=new Image(); i.onload=function(){res(i);}; i.onerror=rej; i.src=src; });
  }
  function wrapLines(ctx,text,maxW){
    var out=[];
    String(text).split(/\r?\n/).forEach(function(par){
      if(par===''){ out.push(''); return; }
      var words=par.split(/(\s+)/), line='';
      words.forEach(function(w){
        if(w==='') return;
        var test=line+w;
        if(ctx.measureText(test).width<=maxW || line===''){ line=test; }
        else{ out.push(line.replace(/\s+$/,'')); line=w.replace(/^\s+/,''); }
        // palavra maior que a linha: quebra por caractere
        while(ctx.measureText(line).width>maxW && line.length>1){
          var j=line.length-1; while(j>1 && ctx.measureText(line.slice(0,j)).width>maxW) j--;
          out.push(line.slice(0,j)); line=line.slice(j);
        }
      });
      out.push(line.replace(/\s+$/,''));
    });
    return out;
  }
  function renderPage(pg,img){
    var cv=document.createElement('canvas'); cv.width=W; cv.height=H;
    var ctx=cv.getContext('2d');
    ctx.drawImage(img,0,0,W,H);
    var ink='#2e1a3a', purple='#3e1c43';
    if(pg.id==='page1') drawPhoto(ctx,PH.x,PH.y,PH.w,PH.h);
    pg.f.forEach(function(d){
      if(d.t==='g'){
        var lv=state[d.k]||0;
        for(var i=0;i<lv;i++){
          var x=d.xs[i]+d.w*0.2, y=d.ys[i]+d.h*0.2, w=d.w*0.6, h=d.h*0.6;
          ctx.fillStyle=purple; ctx.beginPath();
          if(ctx.roundRect) ctx.roundRect(x,y,w,h,3); else ctx.rect(x,y,w,h);
          ctx.fill();
        }
      } else if(d.t==='c'){
        if(state[d.k]){
          ctx.save(); ctx.strokeStyle=purple; ctx.lineWidth=4; ctx.lineCap='round'; ctx.lineJoin='round';
          ctx.beginPath(); ctx.moveTo(d.x+d.w*0.18,d.y+d.h*0.55); ctx.lineTo(d.x+d.w*0.42,d.y+d.h*0.8); ctx.lineTo(d.x+d.w*0.85,d.y+d.h*0.15); ctx.stroke(); ctx.restore();
        }
      } else if(d.t==='t'){
        var v=state[d.k]; if(!v) return;
        ctx.save(); ctx.beginPath(); ctx.rect(d.x,d.y,d.w,d.h); ctx.clip();
        ctx.fillStyle=ink; ctx.font=d.fs+'px '+FONT; ctx.textBaseline='middle';
        var padX=W*0.1/10;  // 10px
        if(d.c){ ctx.textAlign='center'; ctx.fillText(v,d.x+d.w/2,d.y+d.h/2+1,d.w); }
        else{ ctx.textAlign='left'; ctx.fillText(v,d.x+10,d.y+d.h/2+1); }
        ctx.restore();
      } else if(d.t==='a'){
        var v=state[d.k]; if(!v) return;
        ctx.save(); ctx.beginPath(); ctx.rect(d.x,d.y,d.w,d.h); ctx.clip();
        ctx.fillStyle=ink; ctx.font=d.fs+'px '+FONT; ctx.textBaseline='alphabetic'; ctx.textAlign='left';
        var padX=d.pad, padY=d.pad*0.7, lh=d.fs*1.38;
        var lines=wrapLines(ctx,v,d.w-2*padX);
        lines.forEach(function(ln,i){
          // baseline aproximada de uma linha de altura lh
          var y=d.y+padY+i*lh+(lh-d.fs)/2+d.fs*0.82;
          ctx.fillText(ln,d.x+padX,y);
        });
        ctx.restore();
      }
    });
    return cv;
  }
  function b64ToBytes(b64){ var s=atob(b64), u=new Uint8Array(s.length); for(var i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
  function buildPdf(jpegs){
    var PW=498.898, PH=708.661, chunks=[], len=0, offs=[];
    function push(x){ if(typeof x==='string'){ var u=new Uint8Array(x.length); for(var i=0;i<x.length;i++) u[i]=x.charCodeAt(i)&255; x=u; } chunks.push(x); len+=x.length; }
    push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    var n=jpegs.length;
    offs[1]=len; push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
    var kids=[]; for(var i=0;i<n;i++) kids.push((3+3*i)+' 0 R');
    offs[2]=len; push('2 0 obj\n<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>\nendobj\n');
    for(var i=0;i<n;i++){
      var po=3+3*i, co=4+3*i, io=5+3*i;
      offs[po]=len; push(po+' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /XObject << /Im0 '+io+' 0 R >> >> /Contents '+co+' 0 R >>\nendobj\n');
      var content='q '+PW+' 0 0 '+PH+' 0 0 cm /Im0 Do Q';
      offs[co]=len; push(co+' 0 obj\n<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream\nendobj\n');
      offs[io]=len; push(io+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+W+' /Height '+H+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpegs[i].length+' >>\nstream\n');
      push(jpegs[i]); push('\nendstream\nendobj\n');
    }
    var total=3+3*n, xref=len;
    var x='xref\n0 '+total+'\n0000000000 65535 f \n';
    for(var k=1;k<total;k++) x+=('0000000000'+offs[k]).slice(-10)+' 00000 n \n';
    push(x); push('trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF');
    var out=new Uint8Array(len), p=0; chunks.forEach(function(c){ out.set(c,p); p+=c.length; });
    return out;
  }
  function slug(s){ return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase(); }

  var btn=document.getElementById('btnPdf');
  btn.addEventListener('click',function(){
    btn.disabled=true; var old=btn.textContent; btn.textContent='Gerando…';
    var fontReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    fontReady.then(function(){
      return Promise.all(PAGES.map(function(pg){
        var src=document.querySelector('#'+pg.id+' img.bg').src;
        return loadImg(src).then(function(img){ return renderPage(pg,img); });
      }));
    }).then(function(cvs){
      var jpegs=cvs.map(function(c){ return b64ToBytes(c.toDataURL('image/jpeg',0.93).split(',')[1]); });
      var pdf=buildPdf(jpegs);
      var blob=new Blob([pdf],{type:'application/pdf'});
      var name='ficha-etmos-'+slug(state.personagem||ALUNO.nome||ALUNO.id)+'.pdf';
      var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },2000);
    }).catch(function(e){ alert('Não foi possível gerar o PDF. Use "Imprimir" e escolha "Salvar como PDF".'); console.error(e); })
    .then(function(){ btn.disabled=false; btn.textContent=old; });
  });
})();
</script>
