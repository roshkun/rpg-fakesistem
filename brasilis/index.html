<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a2350">
<title>Brasilis — Etmos RPG</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%27M16 2 28 16 16 30 4 16z%27 fill=%27%233e1c43%27/%3E%3C/svg%3E">
<style>
  :root{ --sky:#d9c9f0; --ground:#cbbbe6; --deep:#1d1424; --ink:#3e1c43; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; background:var(--deep); overscroll-behavior:none; }
  body{ font-family: Georgia, "Times New Roman", serif; touch-action:none; user-select:none; -webkit-user-select:none; }

  #scene{ position:fixed; inset:0; overflow:hidden; background:linear-gradient(#d8c8f1 0%, #c9b8e6 45%, #bfa9de 100%); perspective:900px; }
  .layer{ position:absolute; will-change:transform; }

  /* fundo: a escola */
  #bg{ left:50%; top:0; width:170vw; transform:translateX(-50%); }
  #bg img{ display:block; width:100%; height:auto;
           -webkit-mask-image:linear-gradient(#000 82%, transparent 100%); mask-image:linear-gradient(#000 82%, transparent 100%); }
  #ground{ left:-10%; right:-10%; bottom:0; height:62svh; background:linear-gradient(transparent, #a58bd0 70%, #8a6bb8); pointer-events:none; }

  /* personagens */
  .char{ position:absolute; left:calc(var(--x) * 1%); bottom:calc(var(--b) * 1svh); height:calc(var(--h) * 1svh);
         aspect-ratio:var(--ar); transform:translateX(-50%); border:0; padding:0; background:none; cursor:pointer;
         will-change:transform; z-index:var(--z); outline:none; }
  .char .in{ position:relative; display:block; width:100%; height:100%; animation:bob 4.6s ease-in-out infinite; animation-delay:var(--dl); transform-origin:50% 100%; }
  .char img{ display:block; width:100%; height:100%; pointer-events:none; -webkit-user-drag:none;
             filter:drop-shadow(0 6px 10px rgba(30,10,50,.35)); transition:filter .2s, transform .2s; }
  .char.back img{ -webkit-mask-image:linear-gradient(#000 86%, transparent 100%); mask-image:linear-gradient(#000 86%, transparent 100%); filter:drop-shadow(0 4px 8px rgba(30,10,50,.3)) brightness(.97); }
  .char:hover img, .char:focus-visible img{ filter:drop-shadow(0 0 0 transparent) drop-shadow(0 0 14px rgba(255,255,255,.85)); transform:scale(1.03); }
  .char .tag{ position:absolute; left:50%; top:-2%; transform:translate(-50%,-100%) scale(.9); opacity:0; white-space:nowrap;
              background:#2a1536; color:#f4ecfa; font:600 13px/1 system-ui,sans-serif; padding:7px 11px; border-radius:99px;
              border:1px solid #7b4a8a; transition:opacity .15s, transform .15s; pointer-events:none; }
  .char:hover .tag, .char:focus-visible .tag{ opacity:1; transform:translate(-50%,-100%) scale(1); }
  @keyframes bob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-1.1svh) } }

  /* layout mobile (retrato): duas fileiras */
  .c1{ --x:21; --b:35; --h:33; --z:2; --dl:-.4s; }
  .c3{ --x:50; --b:36; --h:34; --z:2; --dl:-1.8s; }
  .c5{ --x:79; --b:35; --h:33; --z:2; --dl:-3s; }
  .c2{ --x:19; --b:-3; --h:41; --z:4; --dl:-2.2s; }
  .c4{ --x:51; --b:-5; --h:43; --z:5; --dl:-.9s; }
  .c6{ --x:83; --b:-3; --h:40; --z:4; --dl:-3.6s; }

  /* hint */
  #hint{ position:absolute; left:50%; bottom:calc(env(safe-area-inset-bottom) + 14px); transform:translateX(-50%); z-index:20;
         font:600 13px/1.2 system-ui,sans-serif; color:#f4ecfa; background:rgba(29,20,36,.78); border:1px solid #7b4a8a;
         padding:10px 16px; border-radius:99px; backdrop-filter:blur(6px); white-space:nowrap; transition:opacity .5s; pointer-events:none; }
  #hint.off{ opacity:0; }
  #motion{ position:absolute; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 62px); z-index:20; display:none;
           font:600 12px/1 system-ui,sans-serif; color:#f4ecfa; background:rgba(29,20,36,.78); border:1px solid #7b4a8a; padding:9px 12px; border-radius:99px; }
  #motion.show{ display:block; }

  #dic{ position:absolute; top:calc(env(safe-area-inset-top) + 12px); left:12px; z-index:20; font:600 13px/1 system-ui,sans-serif; color:#f4ecfa;
        background:rgba(29,20,36,.78); border:1px solid #7b4a8a; padding:10px 13px; border-radius:99px; text-decoration:none; backdrop-filter:blur(6px); }
  #dic:hover{ background:rgba(58,35,80,.9); }
  #scene.picked #dic{ opacity:0; pointer-events:none; }
  /* véu de transição */
  #veil{ position:absolute; inset:0; z-index:30; background:radial-gradient(circle at 50% 45%, #4a2e66, #1d1424 75%); opacity:0; pointer-events:none; transition:opacity .55s ease-in .25s; }
  #bg, #ground{ transition:filter .8s ease, opacity .8s ease; }
  #scene.picked #bg{ filter:blur(5px) brightness(.7); }
  #scene.picked #ground{ opacity:.6; }
  #scene.picked #veil{ opacity:1; }
  #scene.picked #hint, #scene.picked #motion{ opacity:0; pointer-events:none; }
  .char.out{ opacity:0; transition:opacity .35s ease; pointer-events:none; }
  .char.sel{ z-index:15; }
  .char.sel .in{ animation:none; }
  .char.sel img{ filter:drop-shadow(0 0 22px rgba(255,255,255,.9)); }
  .char.sel .tag{ opacity:0; }

  /* desktop / paisagem */
  @media (min-aspect-ratio: 1/1){
    #bg{ width:112vw; }
    .c1{ --x:11; --b:2;  --h:62; --z:3; }
    .c2{ --x:26; --b:-6; --h:70; --z:5; }
    .c3{ --x:41; --b:3;  --h:62; --z:3; }
    .c4{ --x:59; --b:-6; --h:70; --z:5; }
    .c5{ --x:74; --b:3;  --h:62; --z:3; }
    .c6{ --x:89; --b:-6; --h:68; --z:5; }
    .char.back img{ -webkit-mask-image:none; mask-image:none; }
    #hint{ font-size:15px; }
  }
  @media (prefers-reduced-motion: reduce){ .char .in{ animation:none; } }
  #mestre{ position:fixed; left:12px; bottom:calc(env(safe-area-inset-bottom) + 12px); z-index:6; font:600 12px/1 system-ui,sans-serif; color:#f1ecf7; background:rgba(29,20,36,.6); border:1px solid rgba(123,74,138,.6); padding:9px 11px; border-radius:99px; text-decoration:none; backdrop-filter:blur(4px); }
</style>
</head>
<body>
<main id="scene" aria-label="Entrada da escola Brasilis. Escolha um aluno.">
  <div class="layer" id="bg" data-depth="0.25"><img src="assets/cenario/escola-brasilis.webp" alt="Fachada da escola Brasilis" draggable="false"></div>
  <div class="layer" id="ground" data-depth="0.1"></div>
  <div id="chars"></div>
  <div id="hint">Toque em um aluno para abrir a ficha</div>
  <button id="motion" type="button">Ativar movimento</button>
  <a id="dic" href="dicionario.html">📖 Dicionário</a>
  <a id="mestre" href="mestre.html" aria-label="Área do mestre">🔒 Mestre</a>
  <div id="veil"></div>
</main>

<script src="data/alunos.js"></script>
<script>window.MESA_SO_PUBLICAR=true;</script>
<script src="data/mesa.js"></script>
<script src="mesa-cliente.js"></script>
<script>
(function(){
  "use strict";
  var scene=document.getElementById('scene'), box=document.getElementById('chars'), hint=document.getElementById('hint');
  var ALUNOS=window.ALUNOS||[];
  var BACK={1:1,3:1,5:1};       // índices (1-based) da fileira de trás no layout mobile
  var DEPTH={1:.55,3:.6,5:.55,2:1.1,4:1.25,6:1.1};   // profundidade de cada personagem (parallax)
  var layers=[].slice.call(document.querySelectorAll('.layer'));
  var chars=[];
  var picking=false;

  ALUNOS.forEach(function(a,i){
    var n=i+1;
    var b=document.createElement('button');
    b.type='button'; b.className='char c'+n+(BACK[n]?' back':'');
    b.setAttribute('aria-label','Abrir a ficha de '+a.nome);
    var im=new Image(); im.src=a.imagem; im.alt=''; im.draggable=false;
    im.onload=function(){ b.style.setProperty('--ar',(im.naturalWidth/im.naturalHeight).toFixed(4)); };
    b.style.setProperty('--ar',0.55);
    var inn=document.createElement('span'); inn.className='in'; inn.appendChild(im);
    var tag=document.createElement('span'); tag.className='tag'; tag.textContent=a.nome; inn.appendChild(tag);
    b.appendChild(inn);
    b.dataset.depth=DEPTH[n]||1; b.dataset.id=a.id;
    b.addEventListener('click',function(e){ e.stopPropagation(); pick(b,a); });
    box.appendChild(b); chars.push(b);
  });
  var items=layers.concat(chars);

  /* ---------- parallax ---------- */
  var tx=0,ty=0,cx=0,cy=0, lastInput=0, running=true;
  var AMP=function(){ return Math.min(innerWidth,innerHeight*1.2)*0.045; };
  function setTarget(x,y){ tx=Math.max(-1,Math.min(1,x)); ty=Math.max(-1,Math.min(1,y)); lastInput=performance.now(); }
  addEventListener('pointermove',function(e){ setTarget((e.clientX/innerWidth-.5)*2,(e.clientY/innerHeight-.5)*2); },{passive:true});
  addEventListener('pointerdown',function(e){ setTarget((e.clientX/innerWidth-.5)*2,(e.clientY/innerHeight-.5)*2); },{passive:true});
  var gyro=false;
  function onOri(e){
    if(e.gamma==null) return; gyro=true;
    var g=e.gamma, b=e.beta-50;
    setTarget(g/22, b/28);
  }
  var btn=document.getElementById('motion');
  if(window.DeviceOrientationEvent){
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
      btn.classList.add('show');
      btn.addEventListener('click',function(e){ e.stopPropagation();
        DeviceOrientationEvent.requestPermission().then(function(r){ if(r==='granted'){ addEventListener('deviceorientation',onOri); } btn.classList.remove('show'); }).catch(function(){ btn.classList.remove('show'); });
      });
    } else { addEventListener('deviceorientation',onOri); }
  }
  function frame(t){
    if(!running){ return; }
    var idle=(t-lastInput>2500 && !gyro);
    var sx=idle?Math.sin(t/2600)*.45:tx, sy=idle?Math.cos(t/3300)*.18:ty;
    cx+=(sx-cx)*.07; cy+=(sy-cy)*.07;
    var A=AMP();
    for(var i=0;i<items.length;i++){
      var el=items[i], d=parseFloat(el.dataset.depth)||0;
      var x=-cx*A*d, y=-cy*A*d*.35;
      if(el.id==='bg') el.style.transform='translate3d(calc(-50% + '+x.toFixed(1)+'px),'+y.toFixed(1)+'px,0)';
      else if(el.classList.contains('char')) el.style.transform='translate3d(calc(-50% + '+x.toFixed(1)+'px),'+y.toFixed(1)+'px,0)';
      else el.style.transform='translate3d('+x.toFixed(1)+'px,'+y.toFixed(1)+'px,0)';
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  addEventListener('pointerdown',function(){ hint.classList.add('off'); },{once:true});
  document.getElementById('dic').addEventListener('pointerdown',function(e){ e.stopPropagation(); });
  setTimeout(function(){ hint.classList.add('off'); },9000);

  /* ---------- transição ao escolher o aluno ---------- */
  function pick(b,a){
    if(picking) return; picking=true;
    hint.classList.add('off');
    var r=b.getBoundingClientRect();
    var vh=innerHeight, vw=innerWidth;
    var s=Math.min(vh*0.78/r.height, vw*0.9/r.width);
    var dx=vw/2-(r.left+r.width/2), dy=vh*0.52-(r.top+r.height/2);
    running=false;
    chars.forEach(function(c){ if(c!==b) c.classList.add('out'); });
    b.classList.add('sel'); scene.classList.add('picked');
    var cur=getComputedStyle(b).transform;
    var base=b.style.transform;
    b.animate([{transform:base},{transform:base+' translate3d('+dx+'px,'+dy+'px,0) scale('+s+')'}],{duration:750,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'});
    setTimeout(function(){ MesaCliente.perguntar(function(){ location.href='ficha.html?aluno='+encodeURIComponent(a.id)+'&v=3'; }); },820);
  }
  // volta pelo histórico: restaura a cena
  addEventListener('pageshow',function(e){
    if(!e.persisted) return;
    picking=false; running=true; scene.classList.remove('picked');
    chars.forEach(function(c){ c.classList.remove('out','sel'); c.getAnimations().forEach(function(an){an.cancel();}); });
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
